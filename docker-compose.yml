# TradePilot AI 一键部署（服务器演示用）
# 用法：cp .env.example .env（填服务器 Key + ADMIN_PASSWORD）→ docker compose up -d
services:
  tradepilot:
    build: .
    container_name: tradepilot
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 服务器对外演示：默认放行任意 Host（回归修复：原默认 127.0.0.1,localhost
      # 导致远程浏览器访问必被 400 拒绝）。
      # ⚠️ 安全提示：公开部署建议显式设置域名，如 ALLOWED_HOSTS=your-domain.com
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
    volumes:
      - tradepilot-data:/app/data
      # 数据库与缓存持久化（tradepilot.db 由镜像内 RUN 预生成空库，copy-up 进卷）
      - tradepilot-db:/app/tradepilot.db
    restart: unless-stopped

volumes:
  tradepilot-data:
  tradepilot-db:

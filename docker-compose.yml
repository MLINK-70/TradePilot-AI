# TradePilot AI 一键部署（服务器演示用）
# 用法：cp .env.example .env（填服务器 Key + ADMIN_PASSWORD）→ docker compose up -d
services:
  tradepilot:
    build: .
    container_name: tradepilot
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # 服务器对外演示：允许通过域名/Host 访问（按需改成你的域名）
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-127.0.0.1,localhost}
    volumes:
      - tradepilot-data:/app/data
      # 数据库与缓存持久化（tradepilot.db 在容器 /app 下）
      - tradepilot-db:/app/tradepilot.db
    restart: unless-stopped

volumes:
  tradepilot-data:
  tradepilot-db:

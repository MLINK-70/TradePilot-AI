<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradePilot AI — 跨境市场分析</title>
  <link rel="stylesheet" href="style.css?v=5">
  <style>
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; justify-content: center; }
    .tabs a {
      padding: 0.4rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .tabs a.active { background: var(--accent); color: #fff; border-color: transparent; }
    .btn-row { display: flex; gap: 0.8rem; }
    .btn-row .btn-primary { flex: 1; }
    .btn-row .btn-secondary {
      flex: 1;
      padding: 0.7rem;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: transparent;
      color: var(--accent);
      font-size: 1rem;
      cursor: pointer;
    }
    .btn-row .btn-secondary:hover { background: rgba(79, 140, 255, 0.1); }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>
  <header class="hero">
    <span class="eyebrow">AI-Powered Trade Intelligence</span>
    <h1>TradePilot AI</h1>
    <p class="subtitle">输入产品与目标国家，一键生成市场调研报告</p>
    <div class="route-line"><span></span></div>
    <nav class="tabs">
      <a href="/" class="active">市场分析</a>
      <a href="/trade.html">贸易数据</a>
      <a href="/business.html">开发信</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <form id="analyze-form" autocomplete="off">
        <div class="form-row">
          <label for="product">产品</label>
          <input type="text" id="product" placeholder="例如：蓝牙耳机" required>
        </div>
        <div class="form-row">
          <label for="country">目标国家</label>
          <input type="text" id="country" placeholder="例如：德国" required>
        </div>
        <div class="btn-row">
          <button type="submit" id="submit-btn" class="btn-primary">开始分析</button>
          <button type="button" id="dl-report" class="btn-secondary" hidden>下载 Word 报告</button>
        </div>
      </form>
      <p id="status" class="status"></p>
    </section>

    <section id="report" class="report" hidden></section>
  </main>

  <footer>数据由 AI 估算生成，仅供参考，非官方统计</footer>

  <!-- marked + DOMPurify：本地文件（CDN 会被浏览器追踪防护拦截） -->
  <script src="marked.min.js"></script>
  <script src="dompurify.min.js"></script>
  <script>
    // marked 挂了：降级为纯文本渲染（转义 HTML，不破坏 DOMPurify）
    if (typeof marked === 'undefined') {
      window.marked = { parse: function (text) { return '<pre>' + text.replace(/</g, '&lt;') + '</pre>'; } };
    }
    // DOMPurify 挂了：降级为透传（此时报告可渲染，但无 XSS 过滤）
    if (typeof DOMPurify === 'undefined') {
      window.DOMPurify = { sanitize: function (html) { return html; } };
    }
  </script>
  <script src="app.js"></script>
  <script src="theme.js"></script>
</body>
</html>

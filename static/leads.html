<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradePilot AI — 客户线索</title>
  <link rel="stylesheet" href="style.css?v=18">
  <style>
    .leads-form { display: flex; gap: 0.6rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .leads-form input {
      flex: 1; min-width: 160px; padding: 0.7rem; border: 1px solid var(--border);
      border-radius: var(--radius-sm); background: var(--card); color: var(--text); font-size: 0.95rem;
    }
    .lead-card {
      border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; margin-bottom: 0.8rem;
      background: var(--card);
    }
    .lead-card h3 { margin: 0 0 0.4rem; color: var(--text); font-size: 1.02rem; }
    .lead-card .scope { color: var(--text); font-size: 0.88rem; margin-bottom: 0.3rem; }
    .lead-card .meta { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.3rem; }
    .lead-card .src a { color: var(--accent); font-size: 0.78rem; word-break: break-all; }
    .lead-card .actions { margin-top: 0.6rem; }
    .btn-outreach {
      padding: 0.4rem 1rem; border: none; border-radius: 6px; background: var(--accent);
      color: #fff; cursor: pointer; font-size: 0.85rem;
    }
    .btn-outreach:disabled { opacity: 0.5; cursor: wait; }
    #outreach-box { margin-top: 1.2rem; }
    #outreach-box pre {
      white-space: pre-wrap; word-break: break-word; background: var(--card-2);
      border: 1px solid var(--border); border-radius: 10px; padding: 1rem; font-size: 0.88rem;
      font-family: inherit; color: var(--text);
    }
    .status-line { font-size: 0.85rem; color: var(--muted); margin: 0.5rem 0; }
    .status-line.error { color: var(--error); }
    .disclaimer { font-size: 0.75rem; color: var(--muted); margin-top: 1rem; }
  </style>
</head>
<body>
  <header class="brandbar">
    <a class="brand" href="/">Trade<em>Pilot</em><span class="brand-tag">Export Intelligence</span></a>
    <div class="brand-right">
      <button class="theme-toggle" id="theme-toggle" title="切换主题" aria-label="切换主题">🌙</button>
    </div>
  </header>
  <nav class="nav-line">
    <a href="/agent.html">AI Agent</a>
    <a href="/">市场分析</a>
    
    <a href="/trade.html">贸易数据</a>
    <a href="/ecommerce.html">跨境电商</a>
    <a href="/business.html">开发信</a>
    <a href="/leads.html" class="active">客户线索</a>
    <a href="/watch.html">我的订阅</a>
    <a href="/admin.html">管理面板</a>
  </nav>
  <main style="max-width:860px;margin:0 auto;padding:1.2rem 1rem;">
    <h2 style="margin-bottom:0.4rem;color:var(--text);">客户线索检索</h2>
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:1rem;">
      输入产品与目标市场，检索潜在进口商/分销商/零售商线索，一键生成针对性开发信。
    </p>

    <div class="leads-form">
      <input type="text" id="leads-product" placeholder="产品，如 蓝牙耳机">
      <input type="text" id="leads-country" placeholder="目标市场，如 德国">
      <button class="btn-outreach" id="leads-search" style="flex:none;">🔍 检索线索</button>
    </div>

    <div class="status-line" id="leads-status"></div>
    <div id="leads-result"></div>
    <div id="outreach-box"></div>
    <p class="disclaimer" id="leads-disclaimer"></p>

    <hr style="border:none;border-top:1px dashed var(--border);margin:1.5rem 0;">
    <h2 style="margin-bottom:0.4rem;color:var(--text);">📈 销售漏斗</h2>
    <p style="font-size:.85rem;color:var(--muted);margin-bottom:0.8rem;">
      检索到的线索自动进入漏斗：<strong>新线索 → 已发开发信 → 已回复 → 已报价 → 成交/放弃</strong>，
      跟踪每一家的跟进进度。
    </p>
    <div id="funnel-stats" style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.9rem;"></div>
    <div class="leads-form" style="margin-bottom:0.7rem;">
      <select id="funnel-filter" style="flex:1;min-width:120px;padding:0.6rem;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--card);color:var(--text);">
        <option value="">全部状态</option>
        <option value="new">🆕 新线索</option>
        <option value="sent">✉️ 已发开发信</option>
        <option value="replied">💬 已回复</option>
        <option value="quoted">💰 已报价</option>
        <option value="won">✅ 已成交</option>
        <option value="lost">🚫 已放弃</option>
      </select>
      <button class="btn-outreach" id="funnel-refresh" style="flex:none;">刷新漏斗</button>
    </div>
    <div id="funnel-list"></div>
  </main>

  <script>
    // 主题切换：用 data-theme 属性（与 theme.js/style.css 机制对齐；.dark class 不生效——回归修复）
    (function () {
      const btn = document.getElementById('theme-toggle');
      const saved = localStorage.getItem('tradepilot-theme');
      if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      btn.textContent = saved === 'dark' ? '☀️' : '🌙';
      btn.addEventListener('click', () => {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
        localStorage.setItem('tradepilot-theme', dark ? 'light' : 'dark');
        btn.textContent = dark ? '🌙' : '☀️';
      });
    })();

    const statusEl = document.getElementById('leads-status');
    const resultEl = document.getElementById('leads-result');
    const outreachBox = document.getElementById('outreach-box');

    function setStatus(msg, isError) {
      statusEl.textContent = msg;
      statusEl.className = 'status-line' + (isError ? ' error' : '');
    }

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // 来源 URL 安全校验：仅允许 http/https（防 javascript: 协议与属性注入）
    function safeUrl(u) {
      try {
        const p = new URL(String(u || ''));
        return (p.protocol === 'http:' || p.protocol === 'https:') ? p.href : '#';
      } catch (_) { return '#'; }
    }

    document.getElementById('leads-search').addEventListener('click', async () => {
      const product = document.getElementById('leads-product').value.trim();
      const country = document.getElementById('leads-country').value.trim();
      if (!product || !country) { setStatus('请填写产品和目标市场', true); return; }
      setStatus('正在检索客户线索（多组查询词 + AI 画像）…');
      resultEl.innerHTML = '';
      outreachBox.innerHTML = '';
      document.getElementById('leads-disclaimer').textContent = '';
      try {
        const resp = await fetch('/api/leads/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product: product, country: country }),
        });
        const data = await resp.json();
        if (!resp.ok) { setStatus('检索失败：' + (data.detail || resp.status), true); return; }
        if (data.message) { setStatus(data.message, true); return; }
        if (!data.leads || !data.leads.length) { setStatus('未找到匹配的客户线索，可尝试更换产品/市场表述', true); return; }
        setStatus('找到 ' + data.leads.length + ' 条线索（按匹配度排序）');
        document.getElementById('leads-disclaimer').textContent = data.disclaimer || '';
        data.leads.forEach((ld, idx) => {
          const card = document.createElement('div');
          card.className = 'lead-card';
          card.innerHTML =
            '<h3>' + escapeHtml(ld.company) + '</h3>' +
            (ld.business_scope ? '<div class="scope">' + escapeHtml(ld.business_scope) + '</div>' : '') +
            (ld.size_signal ? '<div class="meta">规模信号：' + escapeHtml(ld.size_signal) + '</div>' : '') +
            (ld.match_reason ? '<div class="meta">匹配理由：' + escapeHtml(ld.match_reason) + '</div>' : '') +
            '<div class="src">来源：<a href="' + safeUrl(ld.source_url) + '" target="_blank" rel="noopener">' + escapeHtml(ld.source_url) + '</a></div>' +
            '<div class="actions"><button class="btn-outreach" data-idx="' + idx + '">✉️ 生成开发信</button></div>';
          card.querySelector('button').addEventListener('click', () => outreach(ld, product, country, card.querySelector('button')));
          resultEl.appendChild(card);
        });
      } catch (_) {
        setStatus('网络错误，请重试', true);
      }
    });

    async function outreach(lead, product, country, btn) {
      btn.disabled = true;
      outreachBox.innerHTML = '<div class="status-line">正在生成针对「' + escapeHtml(lead.company) + '」的开发信…</div>';
      try {
        const resp = await fetch('/api/leads/outreach', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product: product, country: country, lead: lead }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          outreachBox.innerHTML = '<div class="status-line error">生成失败：' + escapeHtml(data.detail || resp.status) + '</div>';
          return;
        }
        outreachBox.innerHTML =
          '<h3 style="margin-bottom:0.5rem;color:var(--text);">开发信（' + escapeHtml(lead.company) + '）</h3>' +
          '<div class="status-line">主题：<strong>' + escapeHtml(data.subject || '') + '</strong></div>' +
          '<pre>' + escapeHtml(data.greeting || '') + '\n\n' + escapeHtml(data.body || '') + '\n\n' + escapeHtml(data.closing || '') + '\n' + escapeHtml(data.signature || '') + '</pre>' +
          '<div class="status-line" style="margin-top:0.6rem;">中文要点：' + (data.zh_notes || []).map(escapeHtml).join('；') + '</div>';
      } catch (_) {
        outreachBox.innerHTML = '<div class="status-line error">网络错误，请重试</div>';
      } finally {
        btn.disabled = false;
      }
    }

    // ═══ 销售漏斗（v1.0.2 业务收口）═══
    const F_STATUS_LABEL = {
      new: '🆕 新线索', sent: '✉️ 已发开发信', replied: '💬 已回复',
      quoted: '💰 已报价', won: '✅ 已成交', lost: '🚫 已放弃',
    };
    const F_NEXT = {
      new: [['sent', '✉️ 发开发信'], ['lost', '🚫 放弃']],
      sent: [['replied', '💬 已回复'], ['quoted', '💰 已报价'], ['lost', '🚫 放弃']],
      replied: [['quoted', '💰 已报价'], ['sent', '↩️ 撤回'], ['lost', '🚫 放弃']],
      quoted: [['won', '✅ 成交'], ['lost', '🚫 放弃'], ['replied', '↩️ 回到已回复']],
      won: [], lost: [['new', '🔄 重新激活']],
    };

    async function loadFunnelStats() {
      try {
        const r = await fetch('/api/leads/funnel/stats');
        const s = await r.json();
        const box = document.getElementById('funnel-stats');
        box.innerHTML = '';
        const order = ['new', 'sent', 'replied', 'quoted', 'won', 'lost'];
        order.forEach(k => {
          const chip = document.createElement('span');
          chip.style.cssText = 'padding:0.35rem 0.8rem;border-radius:999px;font-size:0.8rem;background:var(--card-2);border:1px solid var(--border);color:var(--text);';
          chip.textContent = F_STATUS_LABEL[k] + ' ' + (s[k] || 0);
          box.appendChild(chip);
        });
      } catch (_) { /* 统计加载失败静默 */ }
    }

    async function loadFunnel() {
      const status = document.getElementById('funnel-filter').value;
      try {
        const r = await fetch('/api/leads/funnel/list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: status }),
        });
        const data = await r.json();
        const list = document.getElementById('funnel-list');
        list.innerHTML = '';
        const leads = data.leads || [];
        if (!leads.length) {
          list.innerHTML = '<div class="status-line">（漏斗暂无线索——先在上方检索）</div>';
          return;
        }
        leads.forEach(ld => {
          const card = document.createElement('div');
          card.className = 'lead-card';
          const nextBtns = (F_NEXT[ld.status] || []).map(([st, label]) =>
            '<button class="btn-outreach" style="margin-right:0.4rem;" data-act="' + st + '" data-id="' + ld.id + '">' + label + '</button>'
          ).join('');
          card.innerHTML =
            '<h3>' + escapeHtml(ld.company) +
            ' <span style="font-size:.75rem;padding:0.15rem 0.6rem;border-radius:999px;background:var(--accent-soft);color:var(--accent);">' +
            (F_STATUS_LABEL[ld.status] || ld.status) + '</span></h3>' +
            '<div class="meta">' + escapeHtml(ld.product) + ' → ' + escapeHtml(ld.country) +
            ' · ' + escapeHtml((ld.business_scope || '').slice(0, 80)) + '</div>' +
            (ld.note ? '<div class="meta">📝 ' + escapeHtml(ld.note) + '</div>' : '') +
            '<div class="src">来源：<a href="' + safeUrl(ld.source_url) + '" target="_blank" rel="noopener">' + escapeHtml(ld.source_url) + '</a></div>' +
            '<div class="actions">' + nextBtns +
            '<button class="btn-outreach" style="margin-right:0.4rem;background:transparent;border:1px solid var(--error);color:var(--error);" data-act="del" data-id="' + ld.id + '">🗑 删除</button></div>';
          card.querySelectorAll('button[data-act]').forEach(btn => {
            btn.addEventListener('click', async () => {
              const act = btn.dataset.act;
              const id = Number(btn.dataset.id);
              if (act === 'del') {
                if (!confirm('删除这条线索？')) return;
                await fetch('/api/leads/funnel/delete', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ lead_id: id }),
                });
              } else {
                // 回归修复：won/lost 弹备注时用户点"取消"（null）应中止流转，
                // 不能把"取消"当成"空备注照常流转"
                let note = '';
                if (act === 'won' || act === 'lost') {
                  const input = prompt(act === 'won' ? '成交备注（可选，取消则中止）' : '放弃原因（可选，取消则中止）', '');
                  if (input === null) { loadFunnel(); return; }  // 取消：不流转
                  note = input;
                }
                await fetch('/api/leads/funnel/update', {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ lead_id: id, status: act, note: note }),
                });
              }
              loadFunnel(); loadFunnelStats();
            });
          });
          list.appendChild(card);
        });
      } catch (_) {
        document.getElementById('funnel-list').innerHTML = '<div class="status-line error">漏斗加载失败</div>';
      }
    }

    document.getElementById('funnel-refresh').addEventListener('click', () => { loadFunnel(); loadFunnelStats(); });
    document.getElementById('funnel-filter').addEventListener('change', loadFunnel);
    loadFunnelStats();
    loadFunnel();
  </script>
  <script src="settings.js?v=19"></script>
</body>
</html>

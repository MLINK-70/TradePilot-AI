<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradePilot AI — 贸易数据</title>
  <link rel="stylesheet" href="style.css?v=4">
  <style>
    .tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; justify-content: center; }
    .tabs a {
      padding: 0.4rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.9rem;
    }
    .tabs a.active { background: var(--accent); color: #fff; border-color: transparent; }
    .chart-box { margin-top: 1.5rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    #trend-chart { width: 100%; height: 360px; }
    .meta { color: var(--muted); font-size: 0.85rem; margin-top: 0.6rem; }
    .download-row { display: flex; gap: 0.8rem; margin-top: 1rem; }
    .download-row button { flex: 1; }
    .stats { display: flex; gap: 1rem; margin-top: 1rem; }
    .stat { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem; text-align: center; }
    .stat .num { font-size: 1.3rem; font-weight: bold; color: var(--accent); }
    .stat .lbl { color: var(--muted); font-size: 0.8rem; }
    .year-pair { flex: 1; display: flex; align-items: center; gap: 0.6rem; }
    .year-pair input { flex: 1; }
    .year-sep { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
  </style>
</head>
<body>
  <header class="hero">
    <span class="eyebrow">UN Comtrade · Export Intelligence</span>
    <h1>TradePilot AI</h1>
    <p class="subtitle">贸易数据查询（出口流向 · 趋势 · 原始数据）</p>
    <div class="route-line"><span></span></div>
    <nav class="tabs">
      <a href="/">市场分析</a>
      <a href="/trade.html" class="active">贸易数据</a>
    </nav>
  </header>

  <main>
    <section class="card">
      <form id="trade-form" autocomplete="off">
        <div class="form-row">
          <label for="product">产品</label>
          <input type="text" id="product" placeholder="例如：蓝牙耳机 / 8518（HS编码）" required>
        </div>
        <div class="form-row">
          <label for="reporter">出口国</label>
          <input type="text" id="reporter" placeholder="默认中国，可改任意国家" value="中国" list="target-list" required>
        </div>
        <div class="form-row">
          <label for="target">目标市场</label>
          <input type="text" id="target" placeholder="例如：德国 / 欧盟 / 东盟 / RCEP / 全球" list="target-list" required>
          <datalist id="target-list"></datalist>
        </div>
        <div class="form-row">
          <label for="start-year">年份范围</label>
          <div class="year-pair">
            <input type="text" id="start-year" placeholder="起始" value="2020" list="year-list" required>
            <span class="year-sep">至</span>
            <input type="text" id="end-year" placeholder="截至（留空=最新）" list="year-list">
            <datalist id="year-list"></datalist>
          </div>
        </div>
        <button type="submit" id="submit-btn">查询数据</button>
      </form>
      <p id="status" class="status"></p>
    </section>

    <section id="result" hidden>
      <div class="stats">
        <div class="stat"><div class="num" id="stat-total">—</div><div class="lbl">总出口额（美元）</div></div>
        <div class="stat"><div class="num" id="stat-weight">—</div><div class="lbl">总净重（公斤）</div></div>
        <div class="stat"><div class="num" id="stat-count">—</div><div class="lbl">数据记录数</div></div>
      </div>

      <div class="chart-box">
        <div id="trend-chart"></div>
        <p class="meta" id="chart-meta"></p>
      </div>

      <div class="download-row">
        <button id="dl-report">下载 Word 报告</button>
        <button id="dl-data">下载 CSV 数据</button>
      </div>
    </section>
  </main>

  <footer>数据来源：UN Comtrade 公共 API · 出口流向数据</footer>

  <script src="echarts.min.js"></script>
  <script>
    (function () {
      'use strict';

      const form = document.getElementById('trade-form');
      const btn = document.getElementById('submit-btn');
      const statusEl = document.getElementById('status');
      const resultEl = document.getElementById('result');
      let chart = null;

      // 保存最近一次查询，供下载按钮使用
      let lastQuery = null;

      // 图表配色跟随系统主题（暗色/亮色）
      function chartColors() {
        return window.matchMedia('(prefers-color-scheme: dark)').matches
          ? { axis: '#8b9bb8', line: '#1e2b47', accent: '#4f8cff', area: 'rgba(79,140,255,0.15)' }
          : { axis: '#64748b', line: '#dde4ee', accent: '#2e5bff', area: 'rgba(46,91,255,0.12)' };
      }

      // 页面加载时拉取下拉选项
      (async function loadOptions() {
        try {
          const resp = await fetch('/api/trade/options');
          const data = await resp.json();

          const targetList = document.getElementById('target-list');
          data.targets.forEach(t => {
            const opt = document.createElement('option');
            opt.value = t.name + (t.is_group ? '（组织聚合）' : '');
            targetList.appendChild(opt);
          });

          const yearList = document.getElementById('year-list');
          for (let y = 2024; y >= 1990; y--) {
            const opt = document.createElement('option');
            opt.value = String(y);
            yearList.appendChild(opt);
          }
        } catch (_) {
          // 选项加载失败不阻断手动输入
        }
      })();

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const product = document.getElementById('product').value.trim();
        const reporter = document.getElementById('reporter').value.trim();
        // 剥离"（组织聚合）"后缀：显示名带提示，提交名需与后端代码表一致
        const target = document.getElementById('target').value.trim().replace('（组织聚合）', '');
        const startYear = parseInt(document.getElementById('start-year').value, 10);
        const endYearRaw = document.getElementById('end-year').value.trim();
        const endYear = endYearRaw ? parseInt(endYearRaw, 10) : null;

        if (!product || !target || !startYear) {
          showStatus('请填写产品、目标市场和起始年份', 'error');
          return;
        }
        if (endYear !== null && endYear < startYear) {
          showStatus('截至年份不能早于起始年份', 'error');
          return;
        }

        btn.disabled = true;
        btn.textContent = '查询中…';
        showStatus('正在从 UN Comtrade 获取数据，组织聚合可能需要 1-2 分钟…', 'info');
        resultEl.hidden = true;

        try {
          const resp = await fetch('/api/trade/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ product, target, start_year: startYear, end_year: endYear, reporter }),
          });
          let data = {};
          try { data = await resp.json(); } catch (_) {}

          if (!resp.ok) {
            showStatus(data.detail || '查询失败，请稍后重试', 'error');
            return;
          }

          lastQuery = { product, reporter, target, start_year: startYear, end_year: endYear };
          render(data);
          showStatus('', '');
        } catch (err) {
          showStatus('网络错误，请确认后端服务已启动', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = '查询数据';
        }
      });

      function render(data) {
        document.getElementById('stat-total').textContent = data.total_value.toLocaleString('zh-CN');
        document.getElementById('stat-weight').textContent = data.total_weight.toLocaleString('zh-CN');
        document.getElementById('stat-count').textContent = data.record_count;
        document.getElementById('chart-meta').innerHTML =
          'HS' + data.hs_code + ' · ' + (data.hs_description || '品名待确认') +
          '<br>' + (lastQuery.reporter || '中国') + '出口至' + lastQuery.target +
          ' · 数据来源 UN Comtrade';

        const years = data.trend.map(t => t.year);
        const values = data.trend.map(t => t.value);

        // 先显示容器再初始化图表（hidden 容器里 init 会算出 0 尺寸，图挤成一团）
        resultEl.hidden = false;

        if (chart) { chart.dispose(); }
        const c = chartColors();
        chart = echarts.init(document.getElementById('trend-chart'));
        chart.setOption({
          backgroundColor: 'transparent',
          tooltip: {
            trigger: 'axis',
            formatter: function (params) {
              const p = params[0];
              return p.name + '年：' + p.value.toLocaleString('zh-CN') + ' 美元';
            },
          },
          grid: { left: 90, right: 30, top: 30, bottom: 40 },
          xAxis: { type: 'category', data: years, axisLabel: { color: c.axis } },
          yAxis: {
            type: 'value',
            axisLabel: { color: c.axis, formatter: v => (v / 1e8).toFixed(1) + '亿' },
            splitLine: { lineStyle: { color: c.line } },
          },
          series: [{
            name: '出口额',
            type: 'line',
            data: values,
            smooth: true,
            symbolSize: 8,
            lineStyle: { color: c.accent, width: 3 },
            itemStyle: { color: c.accent },
            areaStyle: { color: c.area },
          }],
        });
      }

      document.getElementById('dl-report').addEventListener('click', async () => {
        if (!lastQuery) return;
        const resp = await fetch('/api/trade/export/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            product: lastQuery.product, target: lastQuery.target,
            start_year: lastQuery.start_year, end_year: lastQuery.end_year,
            reporter: lastQuery.reporter,
          }),
        });
        if (resp.ok) {
          const blob = await resp.blob();
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'TradePilot-报告.docx';
          a.click();
        } else {
          showStatus('报告下载失败', 'error');
        }
      });

      document.getElementById('dl-data').addEventListener('click', async () => {
        if (!lastQuery) return;
        const resp = await fetch('/api/trade/export/data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            product: lastQuery.product, target: lastQuery.target,
            start_year: lastQuery.start_year, end_year: lastQuery.end_year,
            reporter: lastQuery.reporter,
          }),
        });
        if (resp.ok) {
          const blob = await resp.blob();
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'TradePilot-原始数据.csv';
          a.click();
        } else {
          showStatus('数据下载失败', 'error');
        }
      });

      function showStatus(text, type) {
        statusEl.textContent = text;
        statusEl.className = 'status ' + type;
      }
    })();
  </script>
</body>
</html>
